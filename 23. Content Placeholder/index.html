<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="./style.css" />
        <title>JavaScript Projects | Content Placeholder</title>
        <style></style>
    </head>
    <body>
        <div class="card">
            <div class="card-header animated-bg" id="header">
                <img
                    src="https://images.unsplash.com/photo-1791493192217-b073e3641ebf?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                    alt=""
                />
            </div>
            <div class="card-content">
                <h3 class="card-title animated-bg animated-bg-text" id="title">
                    Lorem ipsum dolor sit amet.
                </h3>
                <p class="card-excerpt" id="excerpt">
                    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ab
                    nulla iusto debitis suscipit quaerat?
                    <span class="animated-bg animated-bg-text">&nbsp;</span>
                    <span class="animated-bg animated-bg-text">&nbsp;</span>
                    <span class="animated-bg animated-bg-text">&nbsp;</span>
                    <span class="animated-bg animated-bg-text">&nbsp;</span>
                </p>
                <div class="author">
                    <div class="profile-img animated-bg" id="profile_img">
                        <img
                            src="https://randomuser.me/api/portraits/men/45.jpg"
                            alt=""
                        />
                    </div>
                    <div class="author-info" id="name">
                        <strong class="animated-bg animated-bg-text">
                            John Doe
                        </strong>
                        <small class="animated-bg animated-bg-text"
                            >Oct 08, 2026</small
                        >
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
